title: Time

tabs:
  general:
    fields:
      time: true
      icon:
        type: time
        icon: heart
      before:
        type: time
        before: Published
      after:
        type: time
        after: Published
      beforeAndAfter:
        type: time
        before: Published
        after: Date
      disabled:
        type: time
        disabled: true
      disabledWithValue:
        type: time
        disabled: true
      disabledDropdown:
        type: time
        times: false
      help:
        type: time
        help: Some help text …
      reference:
        type: time
        width: 1/2
      referenceText:
        type: text
        width: 1/2

  display:
    fields:
      displayAmPm:
        type: time
        notation: 12
      displaySeconds:
        type: time
        display: HH:mm:ss
        step:
          unit: second
          size: 1
      displaySecondsAmPm:
        type: time
        display: hh:mm:ss a
        notation: 12
        step:
          unit: second
          size: 1
      displayEscaped:
        type: time
        label: Escaped display text
        display: HH[h]mm
        help: "French notation: the `h` is printed, never read as an hour marker"
      displayVariableWidth:
        type: time
        label: Variable hour width
        display: h:mm a
        notation: 12
        help: "The hour is one or two characters wide. Tab and ↑/↓ have to follow it"

  parsing:
    fields:
      parseFree:
        type: time
        label: Free input
        display: HH:mm
        help: "`9`, `5:12`, `1234` – separators and padding are free"
      parseMeridiem:
        type: time
        label: Meridiem
        display: h:mm a
        notation: 12
        help: "Type `5:12 pm`, then ↑/↓ on `pm` – it toggles am/pm instead of stepping a day"
      parseInvalid:
        type: time
        label: Invalid input
        display: HH:mm
        help: "Type `25:61` and leave: the text stays and the field goes invalid"
      parseEmpty:
        type: time
        label: Empty
        display: HH:mm
        step:
          unit: minute
          size: 15
        help: "↑/↓ in the empty field fills in now, rounded to the 15-minute step"

  step:
    fields:
      minute:
        type: time
        label: 5 Minutes
        step:
          unit: minute
          size: 5
      hour:
        type: time
        label: 1 Hour
        step:
          unit: hour
          size: 1

  validation:
    fields:
      required:
        type: time
        required: true

  widths:
    fields:
      oneHalf1:
        type: time
        width: 1/2
      oneHalf2:
        type: time
        width: 1/2
        before: Before
        after: After
      oneThird1:
        type: time
        width: 1/3
      oneThird2:
        type: time
        width: 1/3
      oneThird3:
        type: time
        width: 1/3
        before: Before
        after: After
      oneQuarter1:
        type: time
        width: 1/4
      oneQuarter2:
        type: time
        width: 1/4
      oneQuarter3:
        type: time
        width: 1/4
      oneQuarter4:
        type: time
        width: 1/4
        before: Before
        after: After

  preview:
    fields:
      structurePreview:
        type: structure
        fields:
          time:
            type: time
          timeDisplay:
            type: time
            display: hh:mm a
      objectPreview:
        type: object
        fields:
          time:
            type: time
          timeDisplay:
            type: time
            display: hh:mm a
