title: Filter

tabs:
  general:
    fields:
      filter:
        label: No fields
        type: filter
      simple:
        extends: fields/filter/simple
      empty:
        extends: fields/filter/simple
        empty: Custom empty text
      disabled:
        extends: fields/filter/simple
        disabled: true
      disabledWithValue:
        extends: fields/filter/simple
        disabled: true
      help:
        extends: fields/filter/simple
        help: Custom help text

  operators:
    fields:
      equality:
        extends: fields/filter/simple
        label: Only is / is not
        help: All field types support these operators
        operators:
          - "=="
          - "!="
      text:
        extends: fields/filter/simple
        label: Text operators
        help: Only text fields can be selected, as no other field type supports these operators
        operators:
          - "*="
          - "!*="
          - "^="
          - "!^="
          - "$="
          - "!$="
      comparison:
        extends: fields/filter/simple
        label: Comparison operators
        help: Only date and number fields can be selected, as no other field type supports these operators
        operators:
          - ">"
          - ">="
          - "<"
          - "<="
      single:
        extends: fields/filter/simple
        label: Single operator
        help: The operator column is hidden, as all fields share the same single operator
        operators:
          - "=="
      mixed:
        extends: fields/filter/simple
        label: Mixed operators
        help: Status and title only offer "is" and show it as text. Date and views can also choose "is greater than"
        operators:
          - "=="
          - ">"

  types:
    fields:
      types:
        type: filter
        fields:
          color:
            type: color
          date:
            type: date
          email:
            type: email
          number:
            type: number
          select:
            type: select
            options:
              - a
              - b
              - c
          slugField:
            label: Slug
            type: slug
          tel:
            type: tel
          text:
            type: text
          time:
            type: time
          url:
            type: url

  validation:
    fields:
      required:
        extends: fields/filter/simple
        required: true
      max:
        extends: fields/filter/simple
        max: 2
      min:
        extends: fields/filter/simple
        min: 3
      requiredValue:
        label: Required value
        type: filter
        fields:
          title:
            label: Title
            type: text
            required: true
      invalidValue:
        label: Invalid stored value
        extends: fields/filter/simple

  widths:
    fields:
      oneHalf1:
        extends: fields/filter/simple
        width: 1/2
      oneHalf2:
        extends: fields/filter/simple
        width: 1/2
      oneThird1:
        extends: fields/filter/simple
        width: 1/3
      oneThird2:
        extends: fields/filter/simple
        width: 1/3
      oneThird3:
        extends: fields/filter/simple
        width: 1/3
