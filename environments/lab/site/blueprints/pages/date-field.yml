      dateDisabled:
        type: date
        disabled: true
        label: Disabled
      dateDisabledWithValue:
        type: date
        disabled: true
      dateDisabledDropdown:
        type: date
        label: Disabled dropdown
        calendar: false
      dateReference:
        label: Date field
        type: date
        width: 1/2
      dateReferenceText:
        label: Reference text field
        type: text
        width: 1/2

  dateTime:
    fields:
      time:
        type: date
        label: Date & Time
        time: true
      timeIcon:
        type: date
        label: Icon
        icon: edit
        time: true
      timeBefore:
        type: date
        label: Before
        time: true
        before: Published
      timeAfter:
        type: date
        label: After
        time: true
        after: Published
      timeBeforeAndAfter:
        type: date
        label: Before & After
        time: true
        before: Published
        after: Date
      timeHelp:
        type: date
        time: true
        label: Help
        help: Some help text …
      timeDisabled:
        type: date
        time: true
        disabled: true
        label: Disabled
      timeDisabledWithValue:
        type: date
        time: true
        disabled: true
      timeDisabledDropdowns:
        type: date
        label: Disabled dropdowns
        time: true
        calendar: false
        times: false
      timeReference:
        label: Date & Time field
        type: date
        time: true
        width: 1/2
      timeReferenceText:
        label: Reference text field
        type: text
        width: 1/2

  validation:
    fields:
      dateRequired:
        type: date
        label: Required
        required: true
      dateMin:
        type: date
        label: Min
        min: "2026-01-01"
        help: "min: 2026-01-01"
      dateMax:
        type: date
        label: Max
        max: "2028-01-01"
        help: "max: 2028-01-01"
      dateMinMax:
        type: date
        label: Min & max
        min: "2026-01-01"
        max: "2028-02-01"
        help: "min: 2026-01-01 max: 2028-02-01"
      dateMinFuture:
        type: date
        label: Min in the future
        min: "2030-01-01"
        help: "The placeholder of the empty field shows the earliest allowed date, not today"
      dateTimeMinMax:
        type: date
        label: Min & max with time
        time: true
        min: "2022-01-01 08:00:00"
        max: "2022-02-01 18:00:00"
        help: "Boundaries carry a time part, the date input still has to read them"

  display:
    fields:
      displayEurope:
        type: date
        label: Europe
        display: DD.MM.YYYY
      displayUs:
        type: date
        label: US
        display: MM/DD/YYYY
      displayMonth:
        type: date
        label: Month name
        display: DD. MMMM YYYY
      displayYear:
        type: date
        label: Year
        display: YYYY
        step: year
      displayAmPm:
        type: date
        label: AM/PM
        time:
          notation: 12
      displaySeconds:
        type: date
        label: Seconds
        time:
          display: HH:mm:ss
          step:
            unit: second
            size: 1
      displaySecondsAmPm:
        type: date
        label: Seconds (am/pm)
        time:
          display: hh:mm:ss a
          notation: 12
      displayEscaped:
        type: date
        label: Escaped text
        display: "[Am] D. MMMM YYYY"
        time:
          display: HH[h]mm
        help: "`Am` and `h` are printed as they are – never uppercased, read or selected"
      displayVariableWidth:
        type: date
        label: Variable width
        display: D. MMMM YYYY
        help: "Tab through the parts and step them with ↑/↓ while the rendering grows and shrinks"

  parsing:
    fields:
      parseMonthFirst:
        type: date
        label: Month first
        display: MM/DD/YYYY
        width: 1/2
        help: "Type `05-03-2021` – May 3rd here, March 5th next to it"
      parseDayFirst:
        type: date
        label: Day first
        display: DD.MM.YYYY
        width: 1/2
        help: "The same input, read in this field's own format"
      parseFree:
        type: date
        label: Free input
        display: DD.MM.YYYY
        help: "`5`, `5.3`, `5/3/21`, `02032024` – separators and padding are free"
      parseInvalid:
        type: date
        label: Invalid input
        display: DD.MM.YYYY
        help: "Type `nonsense` and leave: the text stays and the field goes invalid. Enter must not save it"
      parseEmpty:
        type: date
        label: Empty
        display: MM/DD/YYYY
        help: "↑/↓ in the empty field fills in today, the next press steps the selected month"

  steps:
    fields:
      stepMonth:
        type: date
        label: Month step
        step: month
      stepYear:
        type: date
        label: Year step
        step: year
      stepMinute:
        type: date
        label: 5-minute step
        time:
          step:
            unit: minute
            size: 5
      stepHour:
        type: date
        label: Hour step
        time:
          step:
            unit: hour
            size: 1

  widths:
    fields:
      oneHalf1:
        type: date
        width: 1/2
      oneHalf2:
        type: date
        width: 1/2
        before: Before
        after: After
      oneThird1:
        type: date
        width: 1/3
      oneThird2:
        type: date
        width: 1/3
      oneThird3:
        type: date
        width: 1/3
        before: Before
        after: After
      oneQuarter1:
        type: date
        width: 1/4
      oneQuarter2:
        type: date
        width: 1/4
      oneQuarter3:
        type: date
        width: 1/4
      oneQuarter4:
        type: date
        width: 1/4
        before: Before
        after: After
      widthsLine:
        type: line
      dateTimeOneHalf1:
        type: date
        time: true
        width: 1/2
      dateTimeOneHalf2:
        type: date
        time: true
        width: 1/2
        before: Before
        after: After
      dateTimeOneThird1:
        type: date
        time: true
        width: 1/3
      dateTimeOneThird2:
        type: date
        time: true
        width: 1/3
      dateTimeOneThird3:
        type: date
        time: true
        width: 1/3
        before: Before
        after: After
      dateTimeOneQuarter1:
        type: date
        time: true
        width: 1/4
      dateTimeOneQuarter2:
        type: date
        time: true
        width: 1/4
      dateTimeOneQuarter3:
        type: date
        time: true
        width: 1/4
      dateTimeOneQuarter4:
        type: date
        time: true
        width: 1/4
        before: Before
        after: After

  preview:
    fields:
      dateStructure:
        type: structure
        fields:
          date: true
          dateDisplay:
            type: date
            display: DD.MM.YYYY
      dateObject:
        type: object
        fields:
          date: true
          dateDisplay:
            type: date
            display: DD.MM.YYYY
      timeStructure:
        type: structure
        fields:
          date:
            type: date
            time: true
          dateDisplay:
            type: date
            display: MM/DD/YYYY
            time:
              display: hh:mm a
      timeObject:
        type: object
        fields:
          date:
            type: date
            time: true
          dateDisplay:
            type: date
            display: MM/DD/YYYY
            time:
              display: hh:mm a

  comparison:
    fields:
      dateForComparison:
        type: date
        width: 1/2
      textForComparison:
        type: text
        width: 1/2
