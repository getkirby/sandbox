title: View buttons

buttons:
  preview: true
  stats:
    icon: chart
    link: "https://my-analytics.com/page/{{ page.uuid.id }}"
    text:
      en: Stats
      de: KPIs
    target: _blank
    theme: aqua
  applause:
    theme: purple
    text: Praise
    praise: Awesome job!
  sync:
    icon: refresh
    text: Sync
    request: button-requests/message/{{ page.id }}
  actions:
    icon: bolt
    text: Actions
    options:
      - text: Sync
        icon: refresh
        request: button-requests/message/dropdown
      - text: Reload
        icon: refresh
        request: button-requests/reload
      - text: Delete
        icon: trash
        request:
          url: button-requests/delete
          method: DELETE
      - "-"
      - text: Failing
        icon: alert
        request: button-requests/error
  settings: true

fields:
  info:
    type: info
    text: See the custom view button for giving some applause on the top right
