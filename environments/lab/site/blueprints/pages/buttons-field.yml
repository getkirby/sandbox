title: Buttons

tabs:
  general:
    fields:
      buttons: true

      simple:
        type: buttons
        buttons:
          - text: Button A
            link: https://getkirby.com
          - text: Button B
            link: https://getkirby.com
          - text: Button C
            link: https://getkirby.com

      icons:
        type: buttons
        buttons:
          - text: Button A
            icon: heart
            link: https://getkirby.com
          - text: Button B
            icon: star
            link: https://getkirby.com
          - text: Button C
            icon: badge
            link: https://getkirby.com

      themes:
        type: buttons
        buttons:
          - text: Button A
            icon: check
            link: https://getkirby.com
            theme: positive
          - text: Button B
            icon: heart
            link: https://getkirby.com
            theme: negative
          - text: Button C
            icon: info
            link: https://getkirby.com
            theme: info

      themesIcon:
        type: buttons
        buttons:
          - text: Button A
            icon: check
            link: https://getkirby.com
            theme: positive-icon
          - text: Button B
            icon: heart
            link: https://getkirby.com
            theme: negative-icon
          - text: Button C
            icon: info
            link: https://getkirby.com
            theme: info-icon

  actions:
    fields:
      modals:
        type: buttons
        buttons:
          - text: Dialog
            icon: title
            dialog: "{{ page.panel.path }}/changeTitle"
          - text: Drawer
            icon: book
            drawer: lab/docs/k-buttons-field

      requests:
        type: buttons
        help: The routes are defined in the `button-requests` plugin
        buttons:
          - text: Message
            icon: chat
            request: button-requests/message/{{ page.id }}
          - text: Reload
            icon: refresh
            request: button-requests/reload
          - text: DELETE
            icon: trash
            request:
              url: button-requests/delete
              method: DELETE
          - text: Without icon
            request: button-requests/message/{{ page.id }}

      requestErrors:
        type: buttons
        buttons:
          - text: Failing
            icon: alert
            theme: negative
            request: button-requests/error
          - text: Dot segments
            icon: cancel
            theme: negative
            request: button-requests/../../api/site

  widths:
    fields:
      oneHalf1:
        extends: fields/buttons/default
        width: 1/2
      oneHalf2:
        extends: fields/buttons/default
        width: 1/2
      oneThird1:
        extends: fields/buttons/default
        width: 1/3
      oneThird2:
        extends: fields/buttons/default
        width: 1/3
      oneThird3:
        extends: fields/buttons/default
        width: 1/3
      oneQuarter1:
        extends: fields/buttons/default
        width: 1/4
      oneQuarter2:
        extends: fields/buttons/default
        width: 1/4
      oneQuarter3:
        extends: fields/buttons/default
        width: 1/4
      oneQuarter4:
        extends: fields/buttons/default
        width: 1/4

  comparison:
    fields:
      buttonsForComparison:
        type: buttons
        buttons:
          - text: Button
        width: 1/2
      textForComparison:
        type: text
        width: 1/2
